name: Mirror TRIBE v2 to GitHub Release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download TRIBE v2 files
        run: |
          curl -L -o config.yaml https://huggingface.co/facebook/tribev2/resolve/main/config.yaml
          curl -L -o best.ckpt https://huggingface.co/facebook/tribev2/resolve/main/best.ckpt
          echo "9c79ffff6b642b7b0c71d558c935fb3fa33f2788bfb509feead94fafbba2f321  best.ckpt" | sha256sum -c -

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0-tribev2 best.ckpt config.yaml --title "TRIBE v2 Weights" --notes "Mirrored weights"
